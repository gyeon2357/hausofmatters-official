<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nametag | blvckmvtter</title>

    <!-- Style -->
    <link
      rel="stylesheet"
      href="../../assets/css/normalize.css"
      type="text/css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="../../assets/css/font-awesome.css"
    />

    <!-- Font -->
    <link rel="stylesheet" href="../../assets/css/font.css" />
    <link rel="stylesheet" href="https://use.typekit.net/lnu1fpi.css" />

    <!-- Icon -->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"
      integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" type="text/css" href="../../assets/css/style.css" />

    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>

    <script src="../../assets/js/jquery-3.6.0.min.js"></script>
    <style>
      body {
        background-color: #0e0e0e;
      }

      .card {
        width: 100vw;
        height: 100vh;
        perspective: 1000px;
        touch-action: pan-y;
      }

      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .card-front,
      .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        display: flex;
        justify-content: center;
        align-items: center;

        scale: 0.9;
      }

      .card-front {
        transform: rotateY(0deg);
      }

      .card-back {
        transform: rotateY(180deg);
      }

      .card img {
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        user-select: none;
      }

      .card-controls {
        display: flex;
        gap: 0.625rem;

        position: fixed;
        transform: translateX(-50%);
        left: 50%;
        bottom: 1rem;

        margin-top: 1rem;
      }

      .card-controls button {
        display: flex;
        align-items: center;

        border: none;
        background: #363636;
        color: white;
        border-radius: 2px;

        padding: 0.5rem 0.625rem;

        font-family: var(--info-font);
        font-size: 0.725rem;
        line-height: 1;
        text-wrap: nowrap;
        white-space: nowrap;

        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <div class="card-inner">
        <div class="card-front">
          <img
            draggable="false"
            alt="blvckmvtter"
            src="../../../assets/images/nametag/nametag_bm_front.png"
          />
        </div>
        <div class="card-back">
          <img
            draggable="false"
            alt="blvckmvtter"
            src="../../../assets/images/nametag/nametag_bm_back.png"
          />
        </div>
      </div>
    </section>

    <aside class="card-controls">
      <button id="downloadBtn">이미지 다운로드</button>
      <button id="shareBtn">공유하기</button>
      <button id="copyBtn">링크 복사</button>
    </aside>
  </body>

  <script src="../../assets/js/gsap.min.js"></script>
  <script>
    const card = document.querySelector(".card");
    const cardInner = card.querySelector(".card-inner");

    let startX = 0;
    let currentX = 0;
    let rotation = 0;
    let isDragging = false;
    let isFlipped = false;
    let isAnimating = false;

    const maxRotation = 180;

    card.addEventListener("touchstart", (e) => {
      if (isAnimating) return;

      startX = e.touches[0].clientX;
      isDragging = true;
      cardInner.style.transition = "none";
    });

    card.addEventListener("touchmove", (e) => {
      if (!isDragging || isAnimating) return;

      currentX = e.touches[0].clientX;
      let diffX = currentX - startX;

      let percent = Math.max(-1, Math.min(1, diffX / card.offsetWidth));
      rotation = percent * maxRotation;

      const totalRotation = isFlipped ? 180 + rotation : rotation;
      cardInner.style.transform = `rotateY(${totalRotation}deg)`;
    });

    card.addEventListener("touchend", () => {
      if (!isDragging || isAnimating) return;

      isDragging = false;
      const totalDelta = Math.abs(currentX - startX);

      if (totalDelta < 20) {
        cardInner.style.transition = "transform 0.3s ease";
        const reset = isFlipped ? 180 : 0;
        cardInner.style.transform = `rotateY(${reset}deg)`;
        return;
      }

      const flippedRatio = Math.abs(rotation) / maxRotation;

      isAnimating = true; // ✅ 시작
      cardInner.style.transition = "transform 0.4s ease";

      if (flippedRatio >= 0.6) {
        isFlipped = !isFlipped;
      }

      const finalRotation = isFlipped ? 180 : 0;
      cardInner.style.transform = `rotateY(${finalRotation}deg)`;

      // ✅ transition 끝나고 다시 활성화
      cardInner.addEventListener(
        "transitionend",
        () => {
          isAnimating = false;
        },
        { once: true }
      );
    });
  </script>

  <script>
    // 1. 이미지 다운로드
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const img = document.querySelector(".card-front img");
      if (!img) return;

      const link = document.createElement("a");
      link.href = img.src;
      link.download = "card-image.jpg"; // 원하는 파일명
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // 2. 공유 버튼 (Web Share API)
    document.getElementById("shareBtn").addEventListener("click", async () => {
      if (navigator.share) {
        try {
          await navigator.share({
            title: document.title,
            url: window.location.href,
          });
        } catch (err) {
          console.error("공유 취소됨", err);
        }
      } else {
        alert("이 브라우저는 공유 기능을 지원하지 않아요 😢");
      }
    });

    // 3. 링크 복사
    document.getElementById("copyBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        alert("링크가 복사되었습니다!");
      } catch (err) {
        console.error("복사 실패", err);
        alert("복사 실패 😢");
      }
    });
  </script>
</html>
